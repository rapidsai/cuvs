name: pr
on:
  push:
    branches:
      - "pull-request/[0-9]+"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions: {}
jobs:
  pr-builder:
    needs:
      - build-details
      - conda-cpp-build
      - rust-build
      - rust-old-crate
    uses: rapidsai/shared-workflows/.github/workflows/pr-builder.yaml@main
    permissions:
      contents: read
    if: always()
    with:
      needs: ${{ toJSON(needs) }}
  build-details:
    uses: rapidsai/shared-workflows/.github/workflows/compute-build-details.yaml@main
  conda-cpp-build:
    needs: [build-details]
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    secrets: inherit # zizmor: ignore[secrets-inherit]
    uses: rapidsai/shared-workflows/.github/workflows/conda-cpp-build.yaml@main
    with:
      build_type: pull-request
      build-datetime: ${{ needs.build-details.outputs.build-datetime }}
      node_type: cpu16
      script: ci/build_cpp.sh
      matrix_filter: 'map(select(.ARCH == "amd64")) | sort_by(.CUDA_VER | split(".") | map(tonumber)) | [last]'
  rust-build:
    needs: [conda-cpp-build]
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    uses: ./.github/workflows/matrix-job.yaml
    with:
      build_type: pull-request
      matrix_filter: 'map(select(.ARCH == "amd64")) | sort_by(.CUDA_VER | split(".") | map(tonumber)) | [last] | [range(4) as $i | .[] | . + {COPY: $i, GPU: (if $i < 2 then "rtxpro6000" else "l4" end)}]'
      script: "ci/build_rust.sh"
  rust-old-crate:
    needs: [build-details]
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    uses: ./.github/workflows/matrix-job.yaml
    with:
      build_type: pull-request
      matrix_filter: 'map(select(.ARCH == "amd64")) | sort_by(.CUDA_VER | split(".") | map(tonumber)) | [last] | [range(2) as $i | .[] | . + {COPY: $i, GPU: (if $i < 1 then "rtxpro6000" else "l4" end)}]'
      script: "ci/stress_rust_old.sh"
