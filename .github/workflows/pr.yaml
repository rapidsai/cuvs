name: pr
on:
  push:
    branches:
      - "pull-request/[0-9]+"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions: {}
jobs:
  pr-builder:
    needs:
      - build-details
      - bench-build-base
      - bench-build-pr2801
      - bench-build-pr2804
      - bench
    uses: rapidsai/shared-workflows/.github/workflows/pr-builder.yaml@main
    permissions:
      contents: read
    if: always()
    with:
      needs: ${{ toJSON(needs) }}
  build-details:
    uses: rapidsai/shared-workflows/.github/workflows/compute-build-details.yaml@main
  bench-build-base:
    needs: [build-details]
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    secrets: inherit # zizmor: ignore[secrets-inherit]
    uses: rapidsai/shared-workflows/.github/workflows/conda-cpp-build.yaml@main
    with:
      build_type: pull-request
      build-datetime: ${{ needs.build-details.outputs.build-datetime }}
      node_type: cpu16
      script: ci/bench/build_base.sh
      matrix_filter: map(select(.CUDA_VER == "13.3.0"))
  bench-build-pr2801:
    needs: [build-details]
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    secrets: inherit # zizmor: ignore[secrets-inherit]
    uses: rapidsai/shared-workflows/.github/workflows/conda-cpp-build.yaml@main
    with:
      build_type: pull-request
      build-datetime: ${{ needs.build-details.outputs.build-datetime }}
      node_type: cpu16
      script: ci/bench/build_pr2801.sh
      matrix_filter: map(select(.CUDA_VER == "13.3.0"))
  bench-build-pr2804:
    needs: [build-details]
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    secrets: inherit # zizmor: ignore[secrets-inherit]
    uses: rapidsai/shared-workflows/.github/workflows/conda-cpp-build.yaml@main
    with:
      build_type: pull-request
      build-datetime: ${{ needs.build-details.outputs.build-datetime }}
      node_type: cpu16
      script: ci/bench/build_pr2804.sh
      matrix_filter: map(select(.CUDA_VER == "13.3.0"))
  bench:
    needs: [bench-build-base, bench-build-pr2801, bench-build-pr2804]
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    secrets: inherit # zizmor: ignore[secrets-inherit]
    uses: rapidsai/shared-workflows/.github/workflows/conda-cpp-tests.yaml@main
    with:
      build_type: pull-request
      script: "ci/bench/run.sh"
      matrix_type: nightly
      # DEPENDENCIES selects the workload group of ci/bench/run.sh.
      matrix_filter: '[{ARCH: "amd64", PY_VER: "3.13", CUDA_VER: "13.3.0", LINUX_VER: "ubuntu26.04", GPU: "h100", DRIVER: "latest", DEPENDENCIES: "profile2"}]'
