name: pr
on:
  push:
    branches:
      - "pull-request/[0-9]+"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions: {}
jobs:
  pr-builder:
    needs:
      - conda-python-tests
    uses: rapidsai/shared-workflows/.github/workflows/pr-builder.yaml@main
    permissions:
      contents: read
    if: always()
    with:
      needs: ${{ toJSON(needs) }}
  conda-python-tests:
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    secrets: inherit # zizmor: ignore[secrets-inherit]
    uses: rapidsai/shared-workflows/.github/workflows/conda-python-tests.yaml@main
    with:
      build_type: pull-request
      script: ci/test_python.sh
      run_codecov: false
      container-options: "--cap-add=SYS_PTRACE --security-opt seccomp=unconfined"
      matrix_type: "nightly"
      # One experiment per job, selected by the DEPENDENCIES suffix (see ci/test_python.sh).
      matrix_filter: 'map(select(.GPU == "h100" and .CUDA_VER == "12.9.2" and .LINUX_VER == "ubuntu24.04")) | .[0:1] | [.[] | (. + {DEPENDENCIES: "latest-nsys"}), (. + {DEPENDENCIES: "latest-sepproc"}), (. + {DEPENDENCIES: "latest-pinned"}), (. + {DEPENDENCIES: "latest-clb"})]'
