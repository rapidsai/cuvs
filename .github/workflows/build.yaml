name: build

on:
  push:
    branches:
      - "main"
      - "release/*"
    tags:
      - v[0-9][0-9].[0-9][0-9].[0-9][0-9]
  workflow_dispatch:
    inputs:
      branch:
        description: |
          branch: git branch the workflow run targets.
          Required even when 'sha' is provided because it is also used for organizing artifacts.
        required: true
        type: string
      date:
        description: "date: Date (YYYY-MM-DD) this run is for. Used to organize artifacts produced by nightly builds"
        required: true
        type: string
      sha:
        description: "sha: full git commit SHA to check out"
        required: true
        type: string
      build_type:
        description: "build_type: one of [branch, nightly, pull-request, release-candidate]"
        type: string
        default: nightly

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}-${{ inputs.build_type || 'branch' }}
  cancel-in-progress: true

permissions: {}

jobs:
  build-details:
    uses: rapidsai/shared-workflows/.github/workflows/compute-build-details.yaml@db1cddb6cdf80d1836de64085bb653bea4571867
  cpp-build:
    needs: [build-details]
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    uses: rapidsai/shared-workflows/.github/workflows/conda-cpp-build.yaml@db1cddb6cdf80d1836de64085bb653bea4571867
    with:
      build_type: ${{ inputs.build_type || 'branch' }}
      build-datetime: ${{ needs.build-details.outputs.build-datetime }}
      branch: ${{ inputs.branch }}
      date: ${{ inputs.date }}
      node_type: cpu16
      script: ci/build_cpp.sh
      sha: ${{ inputs.sha }}

  rocky8-clib-standalone-build:
    if: >-
      ${{ inputs.build_type != 'release-candidate'
      && github.event.inputs.build_type != 'release-candidate'
      && !startsWith(github.ref, 'refs/heads/release-test-')
      && !startsWith(github.ref, 'release-test-')
      && !startsWith(github.ref_name, 'release-test-')
      && !startsWith(github.head_ref, 'release-test-')
      && !startsWith(github.head_ref, 'refs/heads/release-test-')
      && !startsWith(inputs.branch, 'release-test-')
      && !startsWith(inputs.branch, 'refs/heads/release-test-')
      && github.ref != 'agent/release-catalog-canary'
      && github.ref != 'refs/heads/agent/release-catalog-canary'
      && github.head_ref != 'agent/release-catalog-canary'
      && github.head_ref != 'refs/heads/agent/release-catalog-canary'
      && inputs.branch != 'agent/release-catalog-canary'
      && inputs.branch != 'refs/heads/agent/release-catalog-canary' }}
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    uses: ./.github/workflows/clib-build.yaml
    with:
      build_type: ${{ inputs.build_type || 'branch' }}
      branch: ${{ inputs.branch }}
      date: ${{ inputs.date }}
      sha: ${{ inputs.sha }}
  rust-build:
    needs: cpp-build
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    uses: ./.github/workflows/matrix-job.yaml
    # Artifacts are not published from these jobs, so it's safe to run for multiple CUDA versions.
    # If these jobs start producing artifacts, the names will have to differentiate between CUDA versions.
    with:
      build_type: ${{ inputs.build_type || 'branch' }}
      branch: ${{ inputs.branch }}
      date: ${{ inputs.date }}
      sha: ${{ inputs.sha }}
      matrix_filter: map(select(.ARCH == "amd64"))
      script: "ci/build_rust.sh"
  go-build:
    needs: cpp-build
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    uses: ./.github/workflows/matrix-job.yaml
    # Artifacts are not published from these jobs, so it's safe to run for multiple CUDA versions.
    # If these jobs start producing artifacts, the names will have to differentiate between CUDA versions.
    with:
      build_type: ${{ inputs.build_type || 'branch' }}
      branch: ${{ inputs.branch }}
      date: ${{ inputs.date }}
      sha: ${{ inputs.sha }}
      matrix_filter: map(select(.ARCH == "amd64"))
      script: "ci/build_go.sh"
  java-build:
    needs: cpp-build
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    uses: ./.github/workflows/matrix-job.yaml
    # Artifacts are not published from these jobs, so it's safe to run for multiple CUDA versions.
    # If these jobs start producing artifacts, the names will have to differentiate between CUDA versions.
    with:
      build_type: ${{ inputs.build_type || 'branch' }}
      branch: ${{ inputs.branch }}
      date: ${{ inputs.date }}
      sha: ${{ inputs.sha }}
      node_type: cpu8
      matrix_filter: ${{ inputs.build_type == 'release-candidate' && 'group_by([.ARCH, (.CUDA_VER | split(".") | .[0])]) | map(min_by(.PY_VER | split(".") | map(tonumber)))' || 'map(select(.ARCH == "amd64"))' }}
      script: "ci/build_java.sh"
      artifact-name-prefix: cuvs-java
      file_to_upload: "java/cuvs-java/target/"
      candidate-dependency-family: maven
      candidate-unit-id: maven:cuvs-java
      candidate-prepare-conda-channel: true
      candidate-skip-github-artifact-upload: true
      candidate-artifact-name: ${{ inputs.build_type == 'release-candidate' && 'cuvs-java' || '' }}
      release-catalog-config: '{"release_catalog_key":"maven:cuvs-java","artifact_directory":".release-candidate-artifacts/maven","artifacts":[{"path":"cuvs-java.tar.gz","package_identity_file":"cuvs-java.identity.json"}]}'
  lucene-build:
    # Depends on the Java job for the cuvs-java artifact that cuvs-lucene builds against.
    needs: java-build
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    uses: ./.github/workflows/matrix-job.yaml
    # Artifacts are not published from these jobs, so it's safe to run for multiple CUDA versions.
    # If these jobs start producing artifacts, the names will have to differentiate between CUDA versions.
    with:
      build_type: ${{ inputs.build_type || 'branch' }}
      branch: ${{ inputs.branch }}
      date: ${{ inputs.date }}
      sha: ${{ inputs.sha }}
      node_type: cpu8
      matrix_filter: ${{ inputs.build_type == 'release-candidate' && 'group_by([.ARCH, (.CUDA_VER | split(".") | .[0])]) | map(min_by(.PY_VER | split(".") | map(tonumber)))' || 'map(select(.ARCH == "amd64"))' }}
      script: "ci/build_lucene.sh"
      artifact-name-prefix: cuvs-lucene
      file_to_upload: "java/cuvs-lucene/target/"
      candidate-dependency-family: maven
      candidate-unit-id: maven:cuvs-lucene
      candidate-prepare-conda-channel: true
      candidate-skip-github-artifact-upload: true
      candidate-artifact-name: ${{ inputs.build_type == 'release-candidate' && 'cuvs-lucene' || '' }}
      release-catalog-config: '{"release_catalog_key":"maven:cuvs-lucene","artifact_directory":".release-candidate-artifacts/maven","artifacts":[{"path":"cuvs-lucene.tar.gz","package_identity_file":"cuvs-lucene.identity.json"}]}'
  python-build:
    needs: [build-details, cpp-build]
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    uses: rapidsai/shared-workflows/.github/workflows/conda-python-build.yaml@db1cddb6cdf80d1836de64085bb653bea4571867
    with:
      build_type: ${{ inputs.build_type || 'branch' }}
      build-datetime: ${{ needs.build-details.outputs.build-datetime }}
      branch: ${{ inputs.branch }}
      date: ${{ inputs.date }}
      script: ci/build_python.sh
      sha: ${{ inputs.sha }}
      # Build a conda package for each CUDA x ARCH x minimum supported Python version
      matrix_filter: group_by({CUDA_VER, ARCH}) | map(min_by(.PY_VER | split(".") | map(tonumber)))
  upload-conda:
    needs: [cpp-build, python-build]
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    if: >-
      ${{ inputs.build_type != 'release-candidate'
      && github.event.inputs.build_type != 'release-candidate'
      && !startsWith(github.ref, 'refs/heads/release-test-')
      && !startsWith(github.ref_name, 'release-test-')
      && !startsWith(github.head_ref, 'release-test-')
      && !startsWith(github.head_ref, 'refs/heads/release-test-')
      && !startsWith(inputs.branch, 'release-test-')
      && !startsWith(inputs.branch, 'refs/heads/release-test-')
      && github.ref != 'agent/release-catalog-canary'
      && github.ref != 'refs/heads/agent/release-catalog-canary'
      && github.head_ref != 'agent/release-catalog-canary'
      && github.head_ref != 'refs/heads/agent/release-catalog-canary'
      && inputs.branch != 'agent/release-catalog-canary'
      && inputs.branch != 'refs/heads/agent/release-catalog-canary' }}
    uses: rapidsai/shared-workflows/.github/workflows/conda-upload-packages.yaml@e034a0d95b94775477395838bb7ee1163642291f
    with:
      build_type: ${{ inputs.build_type || 'branch' }}
      branch: ${{ inputs.branch }}
      date: ${{ inputs.date }}
      sha: ${{ inputs.sha }}
      skip_upload_pkgs: libcuvs-template
  rust-publish:
    if: >-
      ${{ inputs.build_type != 'release-candidate'
      && github.event.inputs.build_type != 'release-candidate'
      && !startsWith(github.ref, 'refs/heads/release-test-')
      && !startsWith(github.ref_name, 'release-test-')
      && !startsWith(github.head_ref, 'release-test-')
      && !startsWith(github.head_ref, 'refs/heads/release-test-')
      && !startsWith(inputs.branch, 'release-test-')
      && !startsWith(inputs.branch, 'refs/heads/release-test-')
      && github.ref != 'agent/release-catalog-canary'
      && github.ref != 'refs/heads/agent/release-catalog-canary'
      && github.head_ref != 'agent/release-catalog-canary'
      && github.head_ref != 'refs/heads/agent/release-catalog-canary'
      && inputs.branch != 'agent/release-catalog-canary'
      && inputs.branch != 'refs/heads/agent/release-catalog-canary' }}
    needs: [rust-build, upload-conda]
    permissions:
      contents: read
    secrets:
      GPUTESTER_CRATES_TOKEN: ${{ secrets.GPUTESTER_CRATES_TOKEN }}
    uses: ./.github/workflows/publish-rust.yaml
  docs-build-matrix:
    permissions:
      contents: read
    uses: rapidsai/shared-workflows/.github/workflows/compute-matrix.yaml@e034a0d95b94775477395838bb7ee1163642291f
    with:
      build_type: ${{ inputs.build_type || 'branch' }}
      matrix_name: docs-build
  docs-build:
    needs: [docs-build-matrix]
    if: ${{ github.ref_type == 'branch' && inputs.build_type != 'release-candidate' }}
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    uses: rapidsai/shared-workflows/.github/workflows/custom-job.yaml@e034a0d95b94775477395838bb7ee1163642291f
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.docs-build-matrix.outputs.matrix) }}
    with:
      arch: "${{ matrix.arch }}"
      branch: ${{ inputs.branch }}
      build_type: ${{ inputs.build_type || 'branch' }}
      container_image: "rapidsai/ci-conda:26.12-cuda${{ matrix.CUDA_VER }}-${{ matrix.LINUX_VER }}-py${{ matrix.PY_VER }}"
      date: ${{ inputs.date }}
      node_type: "gpu-${{ matrix.GPU }}-${{ matrix.DRIVER }}-1"
      script: "ci/build_docs.sh"
      sha: ${{ inputs.sha }}
  wheel-build-libcuvs:
    needs: [build-details]
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    uses: rapidsai/shared-workflows/.github/workflows/wheels-build.yaml@db1cddb6cdf80d1836de64085bb653bea4571867
    with:
      build_type: ${{ inputs.build_type || 'branch' }}
      build-datetime: ${{ needs.build-details.outputs.build-datetime }}
      branch: ${{ inputs.branch }}
      sha: ${{ inputs.sha }}
      date: ${{ inputs.date }}
      node_type: cpu16
      script: ci/build_wheel_libcuvs.sh
      # build for every combination of arch and CUDA version, but only for the latest Python
      matrix_filter: group_by([.ARCH, (.CUDA_VER|split(".")|map(tonumber)|.[0])]) | map(max_by(.PY_VER|split(".")|map(tonumber)))
      package-name: libcuvs
      package-type: cpp
  wheel-publish-libcuvs:
    if: >-
      ${{ inputs.build_type != 'release-candidate'
      && github.event.inputs.build_type != 'release-candidate'
      && !startsWith(github.ref, 'refs/heads/release-test-')
      && !startsWith(github.ref_name, 'release-test-')
      && !startsWith(github.head_ref, 'release-test-')
      && !startsWith(github.head_ref, 'refs/heads/release-test-')
      && !startsWith(inputs.branch, 'release-test-')
      && !startsWith(inputs.branch, 'refs/heads/release-test-')
      && github.ref != 'agent/release-catalog-canary'
      && github.ref != 'refs/heads/agent/release-catalog-canary'
      && github.head_ref != 'agent/release-catalog-canary'
      && github.head_ref != 'refs/heads/agent/release-catalog-canary'
      && inputs.branch != 'agent/release-catalog-canary'
      && inputs.branch != 'refs/heads/agent/release-catalog-canary' }}
    needs: wheel-build-libcuvs
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    uses: rapidsai/shared-workflows/.github/workflows/wheels-publish.yaml@e034a0d95b94775477395838bb7ee1163642291f
    with:
      build_type: ${{ inputs.build_type || 'branch' }}
      branch: ${{ inputs.branch }}
      sha: ${{ inputs.sha }}
      date: ${{ inputs.date }}
      package-name: libcuvs
      package-type: cpp
      publish-wheel-search-key: cuvs_wheel_cpp_libcuvs
  wheel-build-cuvs:
    needs: [build-details, wheel-build-libcuvs]
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    uses: rapidsai/shared-workflows/.github/workflows/wheels-build.yaml@db1cddb6cdf80d1836de64085bb653bea4571867
    with:
      build_type: ${{ inputs.build_type || 'branch' }}
      build-datetime: ${{ needs.build-details.outputs.build-datetime }}
      branch: ${{ inputs.branch }}
      sha: ${{ inputs.sha }}
      date: ${{ inputs.date }}
      node_type: cpu8
      script: ci/build_wheel_cuvs.sh
      package-name: cuvs
      package-type: python
      # Build a wheel for each CUDA x ARCH x minimum supported Python version
      matrix_filter: group_by({CUDA_VER, ARCH}) | map(min_by(.PY_VER | split(".") | map(tonumber)))
  wheel-publish-cuvs:
    if: >-
      ${{ inputs.build_type != 'release-candidate'
      && github.event.inputs.build_type != 'release-candidate'
      && !startsWith(github.ref, 'refs/heads/release-test-')
      && !startsWith(github.ref_name, 'release-test-')
      && !startsWith(github.head_ref, 'release-test-')
      && !startsWith(github.head_ref, 'refs/heads/release-test-')
      && !startsWith(inputs.branch, 'release-test-')
      && !startsWith(inputs.branch, 'refs/heads/release-test-')
      && github.ref != 'agent/release-catalog-canary'
      && github.ref != 'refs/heads/agent/release-catalog-canary'
      && github.head_ref != 'agent/release-catalog-canary'
      && github.head_ref != 'refs/heads/agent/release-catalog-canary'
      && inputs.branch != 'agent/release-catalog-canary'
      && inputs.branch != 'refs/heads/agent/release-catalog-canary' }}
    needs: wheel-build-cuvs
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    uses: rapidsai/shared-workflows/.github/workflows/wheels-publish.yaml@e034a0d95b94775477395838bb7ee1163642291f
    secrets: inherit # zizmor: ignore[secrets-inherit]
    with:
      build_type: ${{ inputs.build_type || 'branch' }}
      branch: ${{ inputs.branch }}
      sha: ${{ inputs.sha }}
      date: ${{ inputs.date }}
      package-name: cuvs
      package-type: python
      publish-wheel-search-key: cuvs_wheel_python_cuvs
  devcontainers:
    name: Build devcontainers
    if: >-
      ${{ inputs.build_type != 'release-candidate'
      && github.event.inputs.build_type != 'release-candidate'
      && !startsWith(github.ref, 'refs/heads/release-test-')
      && !startsWith(github.ref_name, 'release-test-')
      && !startsWith(github.head_ref, 'release-test-')
      && !startsWith(github.head_ref, 'refs/heads/release-test-')
      && !startsWith(inputs.branch, 'release-test-')
      && !startsWith(inputs.branch, 'refs/heads/release-test-')
      && github.ref != 'agent/release-catalog-canary'
      && github.ref != 'refs/heads/agent/release-catalog-canary'
      && github.head_ref != 'agent/release-catalog-canary'
      && github.head_ref != 'refs/heads/agent/release-catalog-canary'
      && inputs.branch != 'agent/release-catalog-canary'
      && inputs.branch != 'refs/heads/agent/release-catalog-canary' }}
    secrets: inherit  # zizmor: ignore[secrets-inherit]
    uses: rapidsai/shared-workflows/.github/workflows/build-devcontainers.yaml@main
    permissions:
      packages: write
    with:
      push: true
      cuda: '["12.9", "13.3"]'
